server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    charset utf-8;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Build estático gera este arquivo; ele contém somente valores públicos e deve revalidar.
    location = /api/platform/config.js {
        try_files $uri =404;
        expires -1;
    }

    location = /manus-routes.json {
        try_files $uri =404;
        expires -1;
    }

    location = /index.html {
        try_files $uri =404;
        expires -1;
    }

    # Vite emite nomes com hash dentro de /assets/.
    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    # Arquivos estáticos que não estiverem sob /assets/ nunca recebem fallback da SPA.
    location ~* \.(?:js|css|map|ico|png|jpe?g|gif|svg|webp|woff2?|ttf)$ {
        try_files $uri =404;
        expires 1h;
    }

    # Rotas da aplicação React/Wouter.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
