server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    charset utf-8;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # Healthcheck interno do contêiner; a raiz pública do domínio fica com o site existente.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # O app só deve receber tráfego público através da rota PathPrefix do EasyPanel/Traefik.
    location = /simuladorcasasushi {
        return 308 /simuladorcasasushi/;
    }

    location = /simuladorcasasushi/healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Arquivos públicos especiais não devem cair no fallback da SPA.
    location = /simuladorcasasushi/api/platform/config.js {
        rewrite ^/simuladorcasasushi(/.*)$ $1 break;
        try_files $uri =404;
        expires -1;
    }

    location = /simuladorcasasushi/manus-routes.json {
        rewrite ^/simuladorcasasushi(/.*)$ $1 break;
        try_files $uri =404;
        expires -1;
    }

    location = /simuladorcasasushi/index.html {
        rewrite ^/simuladorcasasushi(/.*)$ $1 break;
        try_files $uri =404;
        expires -1;
    }

    # Bundles com hash: cache longo, com fallback estrito para não devolver HTML em erro de asset.
    location ^~ /simuladorcasasushi/assets/ {
        rewrite ^/simuladorcasasushi(/.*)$ $1 break;
        try_files $uri =404;
        expires 1y;
    }

    # Outros recursos estáticos sob o prefixo também recebem 404 se não existirem.
    location ~* ^/simuladorcasasushi/.*\.(?:js|css|map|ico|png|jpe?g|gif|svg|webp|woff2?|ttf)$ {
        rewrite ^/simuladorcasasushi(/.*)$ $1 break;
        try_files $uri =404;
        expires 1h;
    }

    # Rotas da SPA. O prefixo é retirado apenas dentro deste contêiner.
    location /simuladorcasasushi/ {
        rewrite ^/simuladorcasasushi(/.*)$ $1 break;
        try_files $uri $uri/ /index.html;
    }

    # Fallback local do contêiner para compatibilidade caso o proxy use StripPrefix.
    # O roteador do proxy continua responsável por preservar o site na raiz do domínio.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
